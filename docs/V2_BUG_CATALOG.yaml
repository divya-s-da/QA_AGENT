bugs:
- id: GEN-AUTH-001
  applies: &id001
  - all
  severity: T0
  area: session
  title: Old session still valid after logout
  symptom: After clicking log out, reusing the previous session cookie/token still returns authenticated
    pages/data.
  check: task
  how: Log in, capture a session cookie or request to an authenticated endpoint, log out through the UI,
    then replay the same cookie/request.
  expected: After logout the old session is rejected (401/redirect to login); server-side session is invalidated.
  needs_write: false
  needs_two_accounts: false
- id: GEN-AUTH-002
  applies: *id001
  severity: T0
  area: auth
  title: Login accepts wrong password / no credential check
  symptom: Submitting a known-good username with any wrong password still logs in, or empty password is
    accepted.
  check: task
  how: Attempt login with the test account's email and a deliberately wrong password once (no brute force).
  expected: Wrong password is rejected with an auth error; only correct credentials grant access.
  needs_write: false
  needs_two_accounts: false
- id: GEN-AUTH-003
  applies: *id001
  severity: T1
  area: auth
  title: Login error reveals whether an account exists (user enumeration)
  symptom: Unknown email returns 'no such user' while wrong password returns 'wrong password', letting
    anyone enumerate accounts.
  check: task
  how: Submit login with a clearly non-existent email and with a real email + wrong password; compare
    error text and response timing/shape.
  expected: Both cases return the same generic 'invalid email or password' message.
  needs_write: false
  needs_two_accounts: false
- id: GEN-AUTH-004
  applies: *id001
  severity: T1
  area: auth
  title: Password reset link does not expire or is reusable
  symptom: A password reset link still works long after use or after a new one is issued.
  check: task
  how: Request a reset, use the link, then try the same link again; also request a second reset and try
    the first link.
  expected: A reset link is single-use and invalidated when used or when a newer one is issued.
  needs_write: true
  needs_two_accounts: false
- id: GEN-AUTH-005
  applies: *id001
  severity: T0
  area: auth
  title: Password change / reset does not invalidate other sessions
  symptom: After changing the password, previously established sessions on other devices still work.
  check: task
  how: Log in in session A, change password in session B, then continue using session A.
  expected: Changing or resetting a password terminates other active sessions (or at least the attacker-style
    one).
  needs_write: true
  needs_two_accounts: false
- id: GEN-AUTH-006
  applies: *id001
  severity: T1
  area: auth
  title: 2FA / OTP step can be skipped
  symptom: After password step the app lands on an authenticated page without completing the OTP/2FA challenge,
    or the 2FA page URL can be bypassed by navigating directly.
  check: task
  how: Start a login that requires 2FA, then try navigating directly to a post-login URL or replaying
    the pre-2FA session.
  expected: No authenticated resource is reachable until 2FA completes.
  needs_write: false
  needs_two_accounts: false
- id: GEN-AUTH-007
  applies: *id001
  severity: T2
  area: auth
  title: No confirmation/verification on new account email
  symptom: Accounts become fully active with an unverified email, or verification link is missing.
  check: task
  how: Register (if allowed) with an address you control and check whether privileged actions work before
    verifying.
  expected: 'Per product rules: email ownership is verified before sensitive actions.'
  needs_write: true
  needs_two_accounts: false
- id: GEN-AUTH-008
  applies: *id001
  severity: T1
  area: session
  title: 'Session fixation: session id not rotated on login'
  symptom: The session identifier is the same before and after authenticating.
  check: task
  how: Capture the session cookie value before login, log in, and compare the cookie value after.
  expected: A new session id is issued at login (the pre-auth id is discarded).
  needs_write: false
  needs_two_accounts: false
- id: GEN-AUTH-009
  applies: *id001
  severity: T2
  area: session
  title: Session never times out
  symptom: A session left idle for a long time still works with no re-auth for sensitive areas.
  check: task
  how: Note cookie/token expiry attributes and, where feasible, confirm an old idle session still authenticates.
  expected: 'Per product rules: idle/absolute session timeouts exist, especially for sensitive apps.'
  needs_write: false
  needs_two_accounts: false
- id: GEN-ACCESS-001
  applies: *id001
  severity: T0
  area: access
  title: Authenticated-only page reachable while logged out
  symptom: Pasting a known logged-in URL (dashboard, account, orders) while unauthenticated returns the
    content instead of redirecting to login.
  check: code
  how: Collect URLs seen while logged in, clear cookies, GET each; flag any that return 200 with real
    content instead of a login redirect/401.
  expected: Protected pages redirect to login or return 401/403 when unauthenticated.
  needs_write: false
  needs_two_accounts: false
- id: GEN-ACCESS-002
  applies: *id001
  severity: T0
  area: access
  title: 'IDOR: another user''s record via id in URL/API'
  symptom: Changing an id in a URL or API call (order, invoice, profile, document) returns another user's
    data.
  check: task
  how: With account A, note an object id in a URL/API response; from account B (or by editing the id),
    request the neighbouring/other id.
  expected: Requests for objects the current user does not own return 403/404, not the data.
  needs_write: false
  needs_two_accounts: true
- id: GEN-ACCESS-003
  applies: *id001
  severity: T0
  area: access
  title: Privilege escalation via client-side role control
  symptom: A normal user can reach admin/privileged functions by navigating to admin URLs or because UI
    only hides them client-side.
  check: task
  how: As a low-privilege account, request admin/privileged URLs and endpoints discovered in JS.
  expected: Authorization is enforced server-side; privileged endpoints return 403 for normal users.
  needs_write: false
  needs_two_accounts: false
- id: GEN-ACCESS-004
  applies: *id001
  severity: T0
  area: access
  title: Function-level action not authorized (forced action)
  symptom: A write action (delete, approve, change role) succeeds when called directly even though the
    UI hides it for this user.
  check: task
  how: Capture a privileged write request as an allowed user; replay the same request from a lower-privilege
    account.
  expected: The server rejects actions the current user is not permitted to perform.
  needs_write: true
  needs_two_accounts: true
- id: GEN-ACCESS-005
  applies: *id001
  severity: T0
  area: access
  title: Multi-tenant data leak across organizations
  symptom: A user in tenant/org A can read or act on tenant B data by changing a tenant/org id or object
    id.
  check: task
  how: With accounts in two tenants, swap tenant/object identifiers in requests.
  expected: Each tenant sees only its own data; cross-tenant access is denied.
  needs_write: false
  needs_two_accounts: true
- id: GEN-ACCESS-006
  applies: *id001
  severity: T1
  area: access
  title: Direct object access bypasses UI workflow state
  symptom: An object in a not-yet-eligible state can be advanced/accessed by calling the later-step endpoint
    directly.
  check: task
  how: Identify a multi-step flow; call a later step's endpoint before completing earlier required steps.
  expected: Server enforces the required order/state transitions.
  needs_write: true
  needs_two_accounts: false
- id: GEN-ACCESS-007
  applies: *id001
  severity: T1
  area: access
  title: Deactivated/removed user still has access
  symptom: After a user is removed from an org or deactivated, their existing session/token still works.
  check: task
  how: Remove/deactivate account B (or have it done), then continue using B's existing session.
  expected: Access is revoked promptly after deactivation/removal.
  needs_write: true
  needs_two_accounts: true
- id: GEN-MONEY-001
  applies:
  - shop
  - marketplace
  - bank
  - booking
  - delivery
  - events
  - saas
  - insurance
  - lms
  severity: T0
  area: money
  title: Negative or zero quantity/amount accepted
  symptom: Setting quantity, amount, or price to a negative or zero value is accepted and changes the
